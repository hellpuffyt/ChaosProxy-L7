name: Bug report
description: The proxy forwarded, injected, logged or refused something differently from the documentation.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command, the relevant part of your config (remove anything private), and the output.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smaller the better. The `examples/echo_upstream` server and a `seed` make most faults reproducible.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "`chaosproxy --version` or the commit hash"
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: OS, architecture, rustc version
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, internal hostnames and payloads from logs and configs above.
          required: true
