[package]
name = "chaosproxy-l7"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hellpuffyt/ChaosProxy-L7"
description = "A loopback-by-default Layer 7 fault-injection proxy for HTTP/1.1, h2c and the PostgreSQL wire protocol, with sandboxed WebAssembly rule extensions"
readme = "README.md"
keywords = ["chaos-engineering", "fault-injection", "proxy", "postgresql", "testing"]
categories = ["development-tools::testing", "network-programming"]
publish = false

[lib]
name = "chaosproxy"
path = "src/lib.rs"

[[bin]]
name = "chaosproxy"
path = "src/main.rs"

[features]
default = ["wasm"]
# Sandboxed WebAssembly rule extensions (pulls in wasmtime; disable for faster builds).
wasm = ["dep:wasmtime"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1.3"
http-body = "1.0"
http-body-util = "0.1.5"
humantime-serde = "1.1.1"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server", "server-auto", "server-graceful", "http1", "http2", "tokio", "service"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
wasmtime = { version = "50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "wat"], optional = true }

[dev-dependencies]
proptest = "1.12.0"
tokio-postgres = "0.7.18"

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
